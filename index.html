<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/v2fun.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="V2Fun" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>V2Fun - V2EX Client</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('v2fun_theme');
          var a = localStorage.getItem('v2fun_accent');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          if (['teal','indigo','sage','coral','plum','amber'].indexOf(a) === -1) a = 'teal';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.setAttribute('data-accent', a);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.setAttribute('data-accent', 'teal');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
